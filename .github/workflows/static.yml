# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare independent documentation
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyric Timing Review Guide</title><style>body{font:18px/1.65 system-ui,sans-serif;color:#1b2738;background:#f5f7fb;margin:0}main{max-width:850px;margin:2rem auto;padding:2rem;background:white}h2{color:#2d4274;line-height:1.25}a{color:#2b53a4}footer{border-top:1px solid #ddd;margin-top:2rem;padding-top:1rem}</style></head><body><main><h2>A practical workflow for timing lyrics to a karaoke track</h2>
          <p>This guide was prepared with AI writing assistance for the Karaoke Maker project. It describes a review process, not a claim that a particular song has been tested or that any automated separation will remove every vocal artifact. Use music and lyrics only when you have the rights or permission needed for your intended use and distribution.</p>
          <h2>Start with the purpose of the video</h2>
          <p>A karaoke video has two jobs: give singers a backing track they can follow and show the next words early enough to be useful. The decisions that work for a private rehearsal may differ from those needed for a classroom exercise or a public event. Before editing, decide who will sing, where the result will be shown, and whether the audience can read from a distance. A small phone screen rewards simple line breaks; a projected screen may need larger letters and stronger contrast.</p>
          <p>Make a working folder for the source audio, a plain text lyric draft, and exports. Keep the original file unchanged so that a later edit can start from a known source. Give versions descriptive names such as rehearsal-one and timing-review rather than final-final. A short note describing the date and the reason for each export can prevent an older version from being shown by mistake.</p>
          <h2>Choose and inspect the audio</h2>
          <p>Listen to the whole recording before separating voices or editing text. Mark the beginning of the first phrase, the instrumental breaks, repeated choruses, and the ending. A song can contain pickups before the main beat, overlapping voices, a spoken introduction, or a long quiet tail. These details affect when lyrics should appear. Do not assume that a published transcript matches the exact recording; arrangements and repeated lines can vary between versions.</p>
          <p>If your source contains a lead vocal, a separation tool can produce a backing track, but results vary with the recording and processing method. Listen to the output on headphones and on the speaker you expect to use. Pay attention to reverberation, backing vocals, percussion, and audible gaps around the lead voice. If the result is distracting, consider a licensed instrumental version or adjust the performance plan instead of claiming that the track is vocal-free. Keep the source and output labels distinct.</p>
          <p>Check the overall level at a comfortable volume. Avoid pushing an export into clipping simply to make it sound louder. A consistent playback setup, a brief sound check, and a conservative volume setting can be more useful than a dramatic adjustment made on unfamiliar speakers. If the venue has its own audio operator, provide a test file in advance and agree on a backup playback device.</p>
          <h2>Prepare a reliable lyric draft</h2>
          <p>Transcribe the words for the actual recording or use text you are authorized to reproduce. Divide it into short phrases that can be read in a single glance. A line should normally correspond to a natural breath or musical phrase, not just an arbitrary character limit. Long lines can make singers rush their reading, while very short fragments can flash too quickly. Read each line aloud with the song to check the grouping.</p>
          <p>Keep repeated sections explicit in the draft rather than writing only a note such as repeat chorus. The editor and the singer both need to know which occurrence is being timed. Label non-sung sections clearly during preparation, but remove private reminders from a public video. If there are multiple singers, decide whether colors, labels, or alternating lines will distinguish their parts. Test that the distinction is still clear without relying only on color.</p>
          <h2>Map the timing in passes</h2>
          <p>Begin with coarse markers for verses, choruses, and instrumental breaks. Then time individual lines. Set each line to appear before the first word is sung, leaving enough lead-in for the audience to orient itself. The right interval depends on the song&#x27;s tempo, the length of the phrase, and the reading conditions; there is no universal number that works for every performance. Watch the transition between consecutive lines so that the next phrase does not replace the current one before it has been sung.</p>
          <p>Once line timing is coherent, refine word or syllable highlights if the editor supports them. Follow the audible performance, including sustained notes and deliberate pauses. In a fast passage, a highlight that moves a little ahead of the voice may help a reader anticipate the next word, but verify it against the actual track rather than applying the same offset everywhere. Repeated choruses should be reviewed individually because an artist may enter early or extend a phrase on a later repetition.</p>
          <p>Do one pass without looking at the waveform, using only what a singer sees and hears. Ask whether there is enough time to read the next line, whether the highlighted word matches the beat, and whether a quiet or instrumental section needs a visible cue. Then use the waveform or editor markers to correct precise starts and endings. These two views catch different problems: a mathematically close marker can still feel awkward to read, and a plausible visual transition can be slightly out of sync.</p>
          <h2>Make the screen readable</h2>
          <p>Choose a plain background or reduce the visual intensity of an image behind the text. Use a typeface with recognizable letters, a large enough size for the intended display, and a high-contrast foreground. Consider an outline or a translucent panel if the background changes. Avoid placing essential words close to the edges, where a projector, television overscan, or a platform crop might hide them. Leave enough space for the longest line before selecting a layout.</p>
          <p>Preview the video at its intended aspect ratio. A vertical clip and a landscape projection have different safe areas, so a layout that works in one may need a separate version for the other. If captions or interface overlays might cover the lower part of the frame, move the lyric area or check the platform&#x27;s current display rules. Animations should support reading rather than compete with it. A simple progress cue is often easier to follow than a complex effect on every word.</p>
          <h2>Export and check the actual file</h2>
          <p>Export a short test first when the interface offers that option. Play the downloaded file outside the editor, because the final encoding and the playback device can reveal issues that are not obvious in a preview. Check the first phrase, a fast section, a repeated chorus, an instrumental break, and the last line. Confirm that the audio begins and ends as expected and that the lyric display stays synchronized after seeking to different points.</p>
          <p>Choose the output according to the task. A video is useful when the display and timing must travel together. Separate audio may be useful for a sound operator, and subtitles may help with another editing workflow if the application offers that export. Keep the editable project or source notes when available so corrections do not require starting from scratch. Before distributing, review permissions for the recording, lyrics, images, and any other material in the file; a tool cannot grant rights on behalf of their owners.</p>
          <h2>A small review checklist</h2>
          <p>Compare the lyric draft with the chosen recording, confirm that every repeat is present, and check names or unfamiliar words against an authorized source. Listen for audible separation artifacts and verify that backing vocals are handled intentionally. Read the text from the distance at which the audience will see it. Test the timing at normal playback speed, then confirm the exported file on a separate device. Save a backup copy and a brief note of any known limitations.</p>
          <p>For a browser-based workflow that combines vocal removal, timed lyric editing, screen customization, and export options, see <a href="https://aikaraokemaker.com/">ai karaoke maker</a>. Features, limits, and pricing can change, so review the current interface before planning an event. The checklist above remains useful regardless of the editor: prepare an appropriate source, time against the actual recording, make the words readable, and test the final file in the conditions where people will sing.</p><footer>Project-associated and AI-assisted. Verify permissions and the current service terms before sharing.</footer></main></body></html>
          HTML
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
